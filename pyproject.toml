[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nasagent"
version = "0.1.0"
description = "CLI AI agent for operating NAS devices"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "docker>=7.1",
  "httpx>=0.27",
  "langchain-core>=0.3",
  "langgraph>=0.2",
  "openai>=1.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "rich>=13.7",
  "socksio>=1.0",
  "textual>=1.0",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "pytest-httpx>=0.30",
  "ruff>=0.5",
]
ugreen = []
web = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
]

[project.scripts]
nasagent = "nasagent.cli.app:app"
nasagent-web = "nasagent.web.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nasagent"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "ugreen_real: tests that require a real UGREEN NAS and local credentials",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
packages = ["nasagent"]
strict = true
warn_unused_configs = true
